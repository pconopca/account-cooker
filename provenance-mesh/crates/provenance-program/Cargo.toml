[package]
name = "provenance-program"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "On-chain k-anonymous funding rounds: value conservation enforced, funder-recipient mapping unrecorded."

[lib]
crate-type = ["cdylib", "lib"]

# Granular crates rather than the `solana-program` umbrella: the umbrella pulls
# `solana-example-mocks`, which drags in a `wincode` major that conflicts with
# the one the current agave line resolves to.
[dependencies]
borsh = { version = "1.5", features = ["derive"] }
solana-account-info = "3.1"
solana-cpi = "3.1"
solana-instruction = "3.4"
solana-msg = "3.1"
solana-program-entrypoint = "3.1"
solana-program-error = "3.0"
solana-pubkey = { version = "4.2", features = ["borsh", "curve25519"] }
solana-rent = "4.3"
solana-system-interface = { version = "3", features = ["bincode"] }
solana-sysvar = "4.1"

[features]
no-entrypoint = []

[lints]
workspace = true
