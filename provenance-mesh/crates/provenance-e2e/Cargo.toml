[package]
name = "provenance-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "End-to-end proof that a funding round settles on a live cluster."

[dependencies]
provenance-program = { path = "../provenance-program", default-features = false, features = ["no-entrypoint"] }
solana-client = "3"
solana-commitment-config = "3"
solana-keypair = "3"
solana-native-token = "3"
solana-pubkey = { version = "4.2", features = ["curve25519"] }
solana-signer = "3"
solana-system-interface = { version = "3", features = ["bincode"] }
solana-transaction = "3"
solana-instruction = "3.4"

[lints]
workspace = true
